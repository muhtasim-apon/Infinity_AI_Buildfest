# Render Blueprint — Crop Guardian
#
# NOTE: never applied. This declares the intended deployment so it is reviewable.
# Read docs/deployment/render-guide.md and challenges-and-recovery.md first.
#
# Free-tier facts this file is designed around (render.com/docs/free, accessed 2026-10-16):
#   - free web services spin down after 15 min without traffic; spin-up takes about a minute
#   - 750 free instance hours per workspace per month -> only ONE always-warm service fits
#   - filesystem is ephemeral; no persistent disks; single instance only
#   - free Render Postgres expires 30 days after creation -> we use Supabase instead (ADR 0003)

services:
  # ── Frontend: static site (does not spin down, does not consume instance hours) ──
  - type: web
    name: cropguardian-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite          # SPA: every route (/app, /admin, /audit …) serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://cropguardian-api.onrender.com https://*.supabase.co; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cropguardian-api.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ── Backend: FastAPI in Docker ──────────────────────────────────────────────
  - type: web
    name: cropguardian-api
    runtime: docker
    plan: free
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: cropguardian-secrets
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY      # one worker: memory headroom for the ONNX session
        value: "1"

envVarGroups:
  - name: cropguardian-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: AUDIT_HASH_SALT
        generateValue: true
