proxy_http_version 1.1;
proxy_set_header Connection "";   # keepalive to the upstream (and required for SSE)
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
# proxy_read_timeout is set per location (30 s default, 130 s for SSE)
proxy_send_timeout 15s;
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_hide_header X-Powered-By;

# The API also sets these (so they exist on the hosted stack without Nginx). Behind Nginx we keep ONE
# copy - Nginx's, from security-headers.conf - instead of duplicated headers.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Frame-Options;
