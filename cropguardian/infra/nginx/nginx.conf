# Crop Guardian edge (spec 5.1, 16.3, 17.3). TLS, headers, rate limits, LB, static SPA.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;                      # no Server version
  sendfile on;
  tcp_nopush on;

  # --- timeouts (17.3) --------------------------------------------------------------------------
  client_header_timeout 10s;
  client_body_timeout   15s;
  send_timeout          15s;
  keepalive_timeout     30s;
  client_max_body_size  1m;               # uploads go direct to storage via presigned POST

  # --- compression ----------------------------------------------------------------------------
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # --- temp paths writable under a read-only root FS --------------------------------------------
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json '{"t":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","rt":$request_time,"rid":"$request_id"}';  # no query strings
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  include /etc/nginx/conf.d/ratelimit.conf;
  include /etc/nginx/conf.d/upstream.conf;

  # --- HTTP -> HTTPS ----------------------------------------------------------------------------
  server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/conf.d/security-headers.conf;

    if ($request_method = TRACE) { return 405; }   # TRACE blocked

    # Internal-only endpoints (reachable on the `app` network, never through the edge)
    location = /metrics        { return 404; }
    location = /api/health/ready { return 404; }
    location = /health/ready   { return 404; }

    location = /health {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://api/health;
      include /etc/nginx/conf.d/proxy-common.conf;
      proxy_read_timeout 30s;
    }

    # Server-Sent Events: no buffering, long read timeout (130 s)
    location ~ ^/api/.+/events$ {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://api;
      include /etc/nginx/conf.d/proxy-common.conf;
      proxy_buffering off;
      proxy_read_timeout 130s;   # SSE
    }

    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api;
      include /etc/nginx/conf.d/proxy-common.conf;
      proxy_read_timeout 30s;
    }

    location /api/ {
      limit_req zone=general burst=30 nodelay;
      proxy_pass http://api;
      include /etc/nginx/conf.d/proxy-common.conf;
      proxy_read_timeout 30s;
    }

    # SPA: immutable hashed assets, index.html never cached
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/conf.d/security-headers.conf;
      try_files $uri =404;
    }
    location / {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/conf.d/security-headers.conf;
      try_files $uri /index.html;
    }
  }
}
