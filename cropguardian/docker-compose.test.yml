# Test profile (CI + gates): throwaway Postgres/Redis/MinIO on tmpfs. Ports bound to localhost only.
name: cropguardian-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cropguardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
    volumes: ["./infra/postgres/init:/docker-entrypoint-initdb.d:ro"]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["127.0.0.1:55432:5432"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cropguardian"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    user: "999:999"   # entrypoint skips its gosu privilege drop, so cap_drop ALL works
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
