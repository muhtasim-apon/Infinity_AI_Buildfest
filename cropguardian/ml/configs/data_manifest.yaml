# Dataset manifest (spec 9.2, 9.4 step 1). Declarative: names, hosts, sizes, licences and the SHA-256
# values PUBLISHED by the data host (Mendeley Data public API, fetched 2026-10-21).
# Our own computed hashes are recorded in ml/configs/data_lock.json by `python -m cg_ml data verify`;
# any later mismatch aborts the pipeline. Never commit the data itself (gitignored: ml/data/).
#
# status: training_source | evaluation_only | pending_download | blocked_licence_unconfirmed
