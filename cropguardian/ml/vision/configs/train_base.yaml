# Shared training config — per-architecture files override `model`.
# Rationale for every value: docs/ai/vision-model.md §4.
seed: [13, 42, 2026]
data:
  split_file: ml/vision/configs/split_v1.csv     # filenames + split + group id (no images in git)
  image_size: 224
  resize_short_side: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  sampler: class_balanced
augment:
  random_resized_crop: { scale: [0.6, 1.0] }
  hflip: 0.5
  vflip: 0.2
  rotation_deg: 25
  color_jitter: { brightness: 0.3, contrast: 0.3, saturation: 0.2, hue: 0.02 }
  gaussian_blur: { p: 0.2, sigma: [0.1, 2.0] }
  random_shadow: { p: 0.2 }
  jpeg_quality: [40, 95]
train:
  stage1: { freeze_backbone: true, epochs: 5, lr: 1.0e-3 }
  stage2: { unfreeze: last_blocks, epochs: 40, lr: 1.0e-4, schedule: cosine, warmup_epochs: 2 }
  optimizer: adamw
  weight_decay: 0.05
  label_smoothing: 0.1
  class_weights: inverse_sqrt_freq
  batch_size: 32
  amp: true
  early_stopping: { metric: val_macro_f1, patience: 7 }
  cv_folds: 5
candidates:
  - classical_svm          # handcrafted colour + texture features baseline
  - mobilenetv3_large_100
  - tf_efficientnetv2_b0
  - convnext_tiny
  - deit_small_patch16_224
selection_rule:            # fixed before test evaluation (vision-model.md §3)
  max_onnx_int8_mb: 30
  max_cpu_latency_ms_median: 1000
  rank_by: val_macro_f1_mean
  tiebreak: [ece, model_size]
