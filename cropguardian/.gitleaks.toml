# gitleaks configuration: default rules plus a NARROW allow-list for files that are never committed
# or are third-party test data. Never allow-list a tracked source file here.
title = "Crop Guardian gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "local, gitignored or third-party content"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.env$''',                 # generated by `make env`, gitignored
  '''(^|/)infra/nginx/certs/''',    # local dev TLS material, gitignored
  '''(^|/)ml/data/''',              # downloaded datasets, gitignored
  '''(^|/)kb/raw/''',               # downloaded documents, gitignored
  '''(^|/)backend/wheelhouse/''',   # downloaded wheels, gitignored
]
