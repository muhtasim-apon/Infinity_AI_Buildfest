[alembic]
script_location = alembic
prepend_sys_path = .
# The URL comes from MIGRATION_DATABASE_URL in alembic/env.py (owner role), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
