# Spec 19.10: ruff, ruff-format, prettier, eslint (changed files), gitleaks, check_forbidden.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-forbidden
        name: forbidden patterns
        entry: python backend/scripts/check_forbidden.py
        language: system
        pass_filenames: false
      - id: check-layers
        name: layer boundaries
        entry: python backend/scripts/check_layers.py
        language: system
        pass_filenames: false
      - id: eslint-changed
        name: eslint (changed frontend files)
        entry: bash -c 'cd frontend && npx --no-install eslint --max-warnings 0 "${@/#frontend\//}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: prettier-changed
        name: prettier (changed frontend files)
        entry: bash -c 'cd frontend && npx --no-install prettier --check "${@/#frontend\//}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md)$
