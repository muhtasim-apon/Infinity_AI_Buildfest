# Crop Guardian - dev stack (spec 5.1, 8, 16.18). Only nginx publishes ports.
# Secrets come from .env (generated by `make env`); never commit .env.
name: cropguardian

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cropguardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cropguardian"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    image: redis:7-alpine
    # Persistence is OFF: the root FS is read-only and /data is a tmpfs, so a snapshot cannot be written and
    # Redis would refuse every write (MISCONF) - that broke sessions and rate limits. Sessions also live in
    # Postgres (DB fallback), and rate-limit state is disposable.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb",
              "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?run make env}"]
    user: "999:999"
    <<: *hardening
    tmpfs: ["/data"]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning set cg:healthcheck 1 EX 30 | grep OK"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy: { resources: { limits: { memory: 256m } } }

  # Local S3-compatible object store. MinIO withdrew its public images (Docker Hub/Quay, 2026-10-21;
  # DECISIONS D-008), so dev uses RustFS pinned by digest. Hosted uses Supabase Storage (same boto3 code).
  minio:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?run make env}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run make env}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["miniodata:/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [app]
    # The image has no shell tools (bash/curl/nc), so readiness is checked by minio-init, which retries.
    deploy: { resources: { limits: { memory: 256m } } }

  minio-init:
    image: amazon/aws-cli@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
    volumes: ["./infra/minio/init.sh:/init.sh:ro"]
    depends_on: { minio: { condition: service_started } }
    networks: [app]
    restart: "no"

  api:
    build: { context: ./backend }
    environment:
      CG_ENV: development
      LOG_LEVEL: info
      SECRET_KEY: ${SECRET_KEY:?run make env}
      DATABASE_URL: postgresql://cg_api:dev-api-pw@postgres:5432/cropguardian
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOBS_MODE: inprocess
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METRICS_TOKEN: ${METRICS_TOKEN:?run make env}
      TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
      # Identity (Phase 1). Local stack only: console providers print codes/links to the API log;
      # production refuses them (Settings). The public origin is the Nginx HTTPS address.
      APP_BASE_URL: https://localhost
      API_BASE_URL: https://localhost
      TRUSTED_PROXY_HOPS: "1"
      SMS_PROVIDER: console
      EMAIL_PROVIDER: console
      DEMO_ENABLED: "true"
      DEMO_SEED_ON_START: "true"
    <<: *hardening
    tmpfs: ["/tmp"]
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 768m } } }

  migrate:
    build: { context: ./backend }
    profiles: ["tools"]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://cg_migrator:dev-migrator-pw@postgres:5432/cropguardian
    <<: *hardening
    tmpfs: ["/tmp"]
    networks: [app]
    depends_on: { postgres: { condition: service_healthy } }

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./infra/nginx/ratelimit.conf:/etc/nginx/conf.d/ratelimit.conf:ro
      - ./infra/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./infra/nginx/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    <<: *hardening
    tmpfs: ["/tmp"]
    networks: [edge, app]
    # nginx resolves `api` once at start. `restart: true` restarts nginx whenever api is recreated
    # (new container IP), otherwise it would keep proxying to the dead address (504).
    depends_on:
      api: { condition: service_started, restart: true }
    deploy: { resources: { limits: { memory: 128m } } }

networks:
  edge: {}
  app: { internal: true }

volumes:
  pgdata: {}
  miniodata: {}
